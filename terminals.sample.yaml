# The built-in external terminal presets — exactly as the extension holds them
# (src/terminals-default.ts).
#
# This file turns nothing on and nothing off: the presets work without it. It is
# here so you can see how a preset is built and copy a similar one into your own
# ~/.freelens/crt-lens.yaml. The terminals section of the config file is added to
# this table and overrides entries by name: a preset of the same name replaces
# the built-in one entirely, it is not merged per platform.
#
# A preset is data, not code. The extension does exactly three things with it:
# writes the job file, expands the substitutions in argv, and starts the process.
#
#   job       posix | cmd | none — the job file format and the quoting style.
#             posix — an sh script and '…' quotes, cmd — a .cmd file and "…"
#             quotes with doubled %, none — no job file is written, the command
#             goes straight into argv. A platform section may override job with
#             its own (that is how gitbash works: Windows, but a posix job).
#   darwin    \
#   win32      > per-platform sections; no section for the current platform means
#   linux     /  no button with this preset on this machine.
#   argv      the launch command: argv[0] is the binary, the rest are arguments.
#   activate  an optional second launch: what raises the window if the terminal
#             does not do it itself.
#
# Substitutions in argv and in activate:
#
#   {{job}}             path to the job file
#   {{title}}           tab title (already trimmed to tab_title_max)
#   {{command}}         the command itself, as is
#   {{command_quoted}}  the same, escaped for the shell of this preset
#
# Autodetection (when a button has no terminal and default_terminal is not set)
# goes in this order and takes the first preset that has a section for the
# current platform and whose argv[0] exists:
#
#   crt, wt, iterm, kitty, wezterm, ghostty, alacritty, terminal, gitbash, cmd
#
# A preset named explicitly is not checked for the binary — the terminal may
# have been installed in a non-standard place.

terminals:
  # SecureCRT. The command arrives not as arguments but through a job file: the
  # tab finds it by its own title (/N {{title}}), so the job is always written
  # even though argv does not mention it. About the manual setup of the session
  # and the script — examples/securecrt/README.md.
  crt:
    job: posix
    darwin:
      argv:
        - /Applications/SecureCRT.app/Contents/MacOS/SecureCRT
        - /T
        - /N
        - "{{title}}"
        - /S
        - crt-lens
      activate:
        - /usr/bin/osascript
        - -e
        - tell application id "com.vandyke.securecrt" to activate
    win32:
      argv:
        - C:\Program Files\VanDyke Software\SecureCRT\SecureCRT.exe
        - /T
        - /N
        - "{{title}}"
        - /S
        - crt-lens
      job: cmd
    linux:
      argv: [/usr/bin/SecureCRT, /T, /N, "{{title}}", /S, crt-lens]

  # The stock Terminal.app: there is no way to open a tab other than AppleScript.
  terminal:
    job: posix
    darwin:
      argv:
        - /usr/bin/osascript
        - -e
        - tell application "Terminal" to do script "{{job}}"
        - -e
        - tell application "Terminal" to activate

  iterm:
    job: posix
    darwin:
      argv:
        - /usr/bin/osascript
        - -e
        - tell application "iTerm" to create window with default profile command "{{job}}"
        - -e
        - tell application "iTerm" to activate

  kitty:
    job: posix
    darwin:
      argv:
        - /Applications/kitty.app/Contents/MacOS/kitty
        - --title
        - "{{title}}"
        - /bin/bash
        - "{{job}}"
    linux:
      argv: [kitty, --title, "{{title}}", /bin/bash, "{{job}}"]

  wezterm:
    job: posix
    darwin:
      argv:
        - /Applications/WezTerm.app/Contents/MacOS/wezterm
        - start
        - --
        - /bin/bash
        - "{{job}}"
    linux:
      argv: [wezterm, start, --, /bin/bash, "{{job}}"]

  ghostty:
    job: posix
    darwin:
      argv:
        - /Applications/Ghostty.app/Contents/MacOS/ghostty
        - -e
        - /bin/bash
        - "{{job}}"
    linux:
      argv: [ghostty, -e, /bin/bash, "{{job}}"]

  alacritty:
    job: posix
    darwin:
      argv:
        - /Applications/Alacritty.app/Contents/MacOS/alacritty
        - --title
        - "{{title}}"
        - -e
        - /bin/bash
        - "{{job}}"
    linux:
      argv: [alacritty, --title, "{{title}}", -e, /bin/bash, "{{job}}"]

  # Windows Terminal: `-w 0` puts the tab into an already open window.
  wt:
    job: cmd
    win32:
      argv: [wt.exe, -w, "0", nt, --title, "{{title}}", cmd.exe, /k, "{{job}}"]

  cmd:
    job: cmd
    win32:
      argv: [cmd.exe, /c, start, "{{title}}", cmd.exe, /k, "{{job}}"]

  powershell:
    job: cmd
    win32:
      argv: [powershell.exe, -NoExit, -Command, "& '{{job}}'"]

  # Git Bash — the only one on Windows that wants a posix job.
  gitbash:
    win32:
      argv: [C:\Program Files\Git\git-bash.exe, "{{job}}"]
      job: posix
