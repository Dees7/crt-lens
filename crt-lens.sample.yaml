# crt-lens settings: plugin buttons in the menus of cluster objects.
#
# This is an example. The real file is ~/.freelens/crt-lens.yaml, and the
# "Defaults" button in the preferences puts exactly this text into the editor.
# Anything missing from the file falls back to the built-in values, so you can
# keep nothing but your own buttons here.
#
# Every entry under buttons is a menu item and an icon of its own in the detail
# toolbar. type: local — a terminal in the Freelens dock, ext — an external
# terminal by a preset from terminals, url — a link in the browser, logs — the
# built-in log viewer in the dock (it needs neither cmd nor url, and its scopes
# may only name kinds that have pods). The legacy type: crt is read as ext +
# terminal: crt, and log as logs.
#
# terminals — presets of external terminals: argv per platform, job (posix |
# cmd | none) sets the job file format and the quoting style. Substitutions in
# argv: {{job}}, {{title}}, {{command}}, {{command_quoted}}. The presets crt,
# terminal, iterm, kitty, wezterm, ghostty, alacritty, wt, cmd, powershell and
# gitbash are built in — no need to list them here; the terminals section only
# adds your own and overrides built-in ones by name.
# All built-in presets are written out in full, with the fields explained, in
# the neighbouring terminals.sample.yaml — copy an entry from there and adjust.
# The crt preset opens a SecureCRT tab — it needs a one-time manual setup of a
# session and a script, see examples/securecrt/README.md.
#
# vars — a table of variables behind masks: this is where the environment
# identifiers for links go. A key takes its value from the most specific entry.
#
# column: true — the button is also a column in the object list, one column per
# kind in its scopes. A new column appears after Cmd+R.
#
# include_stopped: true — show the button on a stopped pod or container too. By
# default a button is only there for what is running (you cannot shell into a
# dead pod), but the logs of a crashed pod or a finished job are exactly what
# you want to see.
#
# scopes: containers (an item with a submenu of containers), pods, nodes,
# namespaces, or a kind — Deployment, apps/v1:Deployment. A new kind shows up
# after Cmd+R.
#
# The masks context / namespace / pod / container / node / object (glob: * and
# ?) can be put on a button, on a rule and on a vars entry. A value may be a
# list — that is an "or": namespace: [prod, temporal]. object is the name of the
# selected object, the same as {{name}}. A button is visible when all of its
# masks match; buttons sharing an id collapse into one — the most specific wins,
# ties go to the lower one in the file. Rules inside a button compete the same
# way, except that ties go to the upper one.
#
# cmd / shell / image / url / query / terminal are picked independently of each
# other: rule → button → default. A default command exists only for containers
# (pod_command) and nodes (node_command) — other scopes set cmd themselves.
#
# Substitutions (case-insensitive): kubectl, kubeconfig, context, namespace,
# pod, container, node, name, kind, api_version, button, node_namespace,
# node_pod, image, shell, shell_quoted, overrides, platform, from, to,
# query, query_encoded plus everything from vars. On nodes also provider_id,
# provider_path, provider_1 … provider_9 and instance_id — the node's
# spec.providerID, split up (see the gce-vm button below). shell_quoted and
# overrides are already escaped for the shell — do not put them in quotes.

kubectl_path: kubectl

pod_tab_title: "{{pod}}/{{container}}"
node_tab_title: "{{node}}"
tab_title_max: 32

default_shell: "clear; (bash || ash || sh)"
# the same image the built-in node shell of Freelens uses
default_node_image: docker.io/alpine:3.13
node_namespace: kube-system

# The preset for ext buttons without a terminal of their own; empty — autodetect.
default_terminal: ""

# The default commands for the containers and nodes scopes. Worth uncommenting
# only to change them: without them these very lines are what runs.
#
# pod_command: '{{kubectl}} --kubeconfig "{{kubeconfig}}" --context {{context}} exec -i -t -n {{namespace}} {{pod}} -c {{container}} -- sh -c {{shell_quoted}}'
# node_command: '{{kubectl}} --kubeconfig "{{kubeconfig}}" --context {{context}} -n {{node_namespace}} run {{node_pod}} --rm -it --restart=Never --image {{image}} --overrides {{overrides}}'

# The environment table: the identifiers the buttons build their links from.
# The entry behind the "*" mask is shared by every cluster; the entries below it
# override it for narrower masks — when both match, the most specific one wins,
# and only for the keys it actually sets.
vars:
  - context: "*"
    set:
      logs_base: https://logs.example.com
      logs_project: demo
      logs_service: my-service
      dash_base: https://grafana.example.com
      dash_id: kubernetes-pods
      dash_cluster: dev

  - context: "*-prod-*"
    set:
      logs_project: prod
      dash_cluster: prod

buttons:
  # A shell into a container and onto a node, through an external terminal.
  - id: shell
    name: SecureCRT
    type: ext
    terminal: crt
    scopes: [containers, nodes]
    column: false
    include_stopped: false
    confirm: false
    rules:
      - pod: "deploy*"
        shell: bash
      - namespace: prod
        shell: "clear; (bash || ash || sh)"

  # Logs in an external system. An example for a system that takes the selector
  # in a query parameter; adjust url and query for your own.
  - id: logs
    name: Logs
    type: url
    # the material set has no chart — use the built-in icon
    icon: "svg:chart"
    # containers + pods: the item opens the logs of the whole pod, the submenu per container
    scopes: [containers, pods, nodes]
    column: true
    # logs outlive the pod: a crashed pod and a finished job are interesting too
    include_stopped: true
    confirm: false
    # the base is the whole pod; the rules below narrow it for a container and for a node.
    # The container: "*" mask only matches where there is a container at all —
    # that is how you say "and for a container the selector is different".
    query: '{project = "{{logs_project}}", service = "{{logs_service}}", pod = "{{pod}}"}'
    url: "{{logs_base}}/logs?query={{query_encoded}}&from={{from}}&to={{to}}"
    rules:
      - container: "*"
        query: '{project = "{{logs_project}}", service = "{{logs_service}}", pod = "{{pod}}", container = "{{container}}"}'
      # a node has neither pod nor container — select by the node label
      - node: "*"
        query: '{project = "{{logs_project}}", service = "{{logs_service}}", node = "{{node}}"}'

  # Logs in the Freelens dock: the same viewer the native Logs button of a pod
  # gives you, except that the button is on the workload too. Pods are found by
  # owner (for a Deployment — through its ReplicaSet), the tab opens on a running
  # pod, and the neighbouring pods and containers are switched by the selectors
  # of the tab itself. Such a button needs neither cmd nor url — it takes the
  # target from the object.
  - id: dock-logs
    name: Dock logs
    type: logs
    icon: subject
    scopes: [containers, pods, Deployment, StatefulSet, DaemonSet, Job]
    column: true
    include_stopped: true
    confirm: false
    rules: []

  # A dashboard for the pod. An example for Grafana; for your own system one url
  # is all you change.
  - id: mon
    name: Dashboard
    type: url
    icon: insights
    scopes: [pods]
    column: true
    include_stopped: true
    confirm: false
    url: "{{dash_base}}/d/{{dash_id}}?var-cluster={{dash_cluster}}&var-namespace={{namespace}}&var-pod={{pod}}&from=now-1d&to=now"
    rules: []

  # The cloud machine behind a node, in the Google Cloud console. A node's
  # spec.providerID on GKE is gce://<project>/<zone>/<vm name>, and the button
  # gets it split into provider_1, provider_2, provider_3 — so the link needs
  # nothing from vars. The context mask keeps it off non-GKE clusters: GKE names
  # its contexts gke_<project>_<location>_<cluster>.
  - id: gce-vm
    name: GCE VM
    type: url
    icon: cloud
    context: "gke_*"
    scopes: [nodes]
    column: false
    confirm: false
    url: "https://console.cloud.google.com/compute/instancesDetail/zones/{{provider_2}}/instances/{{provider_3}}?project={{provider_1}}"
    rules: []

  # The node's logs in the Google Cloud Logs Explorer: the project comes from
  # spec.providerID again, the selector from query — it reaches the link
  # url-encoded as query_encoded.
  - id: gke-node-logs
    name: GKE node logs
    type: url
    icon: "svg:chart"
    context: "gke_*"
    scopes: [nodes]
    column: false
    confirm: false
    query: 'resource.type="k8s_node" resource.labels.node_name="{{node}}"'
    url: "https://console.cloud.google.com/logs/query;query={{query_encoded}}?project={{provider_1}}"
    rules: []

  # kubectl debug: an ephemeral container with network tools next to the target one.
  - id: debug
    name: Debug
    type: ext
    terminal: ""
    icon: bug_report
    scopes: [containers]
    column: false
    include_stopped: false
    confirm: true
    title: "dbg {{pod}}/{{name}}"
    cmd: '{{kubectl}} --kubeconfig "{{kubeconfig}}" --context {{context}} debug --profile=general -it -n {{namespace}} {{pod}} --target={{name}} --image={{image}} --share-processes -- {{shell}}'
    image: praqma/network-multitool:latest
    shell: bash
    rules:
      # in production a leaner image without the extra tools
      - context: "*-prod-*"
        image: busybox:1.36
        shell: sh

  # Logs of every pod of a workload, in the dock — with a filter asked for before
  # the run. input opens a dialog with a field; the answer is substituted as
  # {{input}} (also {{userinput}}), and {{input_quoted}} is the same in the quotes
  # of the right shell. The dialog rebuilds the command on every keystroke, so you
  # can see what exactly will reach the terminal; Enter in the field is the same
  # as pressing Run. Type "| grep -i error" into it and you get the error lines only.
  - id: wl-logs
    name: All pod logs
    type: local
    icon: article
    scopes: [Deployment, StatefulSet, DaemonSet, Job]
    column: true
    # logs are wanted for what no longer runs, too
    include_stopped: true
    title: "logs {{name}}"
    input:
      label: "Filter — appended to the command"
      # the field opens pre-filled: a normal run is just Enter, you only edit it
      # when you need another filter. default is a template like cmd and knows
      # about every variable
      default: "| grep -i -E 'error|warn'"
      # required: true — an empty answer is not accepted
    cmd: >-
      {{kubectl}} --kubeconfig "{{kubeconfig}}" --context {{context}}
      -n {{namespace}} logs {{kind}}/{{name}}
      --all-pods --all-containers --ignore-errors --prefix
      --tail=200 --max-log-requests=100 -f {{input}}
    rules: []
